name: NoruCore Godot build

# Builds the Godot GDExtension for the four desktop targets NoruCore ships.
# Upstream's workflows are removed on this branch: they need paid Warp runners.
on:
  push:
    branches: [norucore]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # llama.cpp links OpenSSL into llama-common when the runner has it, for model
  # downloads NoruCore never does; users don't have the DLL (Error 126 on Windows).
  # build.rs forwards CMAKE_* to CMake but does not watch them: bump the cache keys below.
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"

jobs:
  linux:
    # 22.04 = glibc 2.35, so the library loads on Ubuntu 22.04.
    runs-on: ubuntu-22.04
    env:
      # libllama/libggml sit next to libnobodywho: find them there.
      RUSTFLAGS: "-C link-arg=-Wl,-rpath,$ORIGIN"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nobodywho/target
          key: linux-nossl-${{ hashFiles('nobodywho/Cargo.lock') }}-${{ hashFiles('nobodywho/core/Cargo.toml', 'nobodywho/godot/Cargo.toml') }}
          restore-keys: linux-nossl-
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.2.5
        with:
          vulkan_version: 1.4.313.0
          cache: true
          install_runtime: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build
      - name: Build
        working-directory: nobodywho
        run: cargo build -p nobodywho-godot --release --locked --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          mkdir out
          R=nobodywho/target/x86_64-unknown-linux-gnu/release
          cp $R/libnobodywho_godot.so out/x86_64-unknown-linux-gnu-release.so
          # ggml backends (CPU variants, Vulkan), then every llama.cpp library the
          # files in out/ need, by soname, as real files (no symlinks).
          find $R/build -path '*llama-cpp-sys-2-*/out/backends/*.so' -exec cp -L {} out/ \;
          changed=1
          while [ $changed = 1 ]; do
            changed=0
            for f in out/*.so*; do
              for n in $(readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
                [ -e "out/$n" ] && continue
                src=$(find $R -name "$n" -print -quit)
                if [ -n "$src" ]; then cp -L "$src" "out/$n"; changed=1; fi
              done
            done
          done
          strip --strip-unneeded out/*.so*
          echo "Unresolved libraries (must be empty except system ones):"
          LD_LIBRARY_PATH=out ldd out/*.so* | grep "not found" && exit 1
          if readelf -d out/*.so* | grep -E "libssl|libcrypto"; then echo "OpenSSL still linked"; exit 1; fi
          echo "Newest glibc symbol required:"
          objdump -T out/*.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: nobodywho-linux-x86_64
          path: out/*
          retention-days: 3

  windows:
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CMAKE_GENERATOR: Ninja
      RUSTFLAGS: "-l Advapi32 -C debuginfo=0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            C:/t
          key: windows-nossl-${{ hashFiles('nobodywho/Cargo.lock') }}-${{ hashFiles('nobodywho/core/Cargo.toml', 'nobodywho/godot/Cargo.toml') }}
          restore-keys: windows-nossl-
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.2.5
        with:
          # Matches llama.cpp's own Windows Vulkan CI (SPIRV-Headers config needed).
          vulkan_version: 1.4.313.2
          cache: true
          install_runtime: true
          stripdown: true
      - name: Ninja
        run: choco install ninja
      - name: Build
        shell: pwsh
        run: |
          # Short paths: llama.cpp's nested submodules exceed MAX_PATH otherwise.
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
          New-Item -ItemType Directory -Force C:/n | Out-Null
          Copy-Item -Recurse -Force ./nobodywho/* C:/n/
          cd C:/n
          cargo build -p nobodywho-godot --release --locked --target x86_64-pc-windows-msvc --target-dir C:/t
      - name: Package
        shell: bash
        run: |
          mkdir out
          cp C:/t/x86_64-pc-windows-msvc/release/nobodywho_godot.dll out/x86_64-pc-windows-msvc-release.dll
          # llama.cpp DLLs, and the ggml backends (CPU variants, Vulkan).
          # Wherever cargo/cmake left them (top level, deps/ or the build out dir), one copy each.
          find C:/t/x86_64-pc-windows-msvc/release \( -name 'llama*.dll' -o -name 'ggml*.dll' -o -name 'mtmd*.dll' \) | while read f; do
            [ -e "out/$(basename "$f")" ] || cp "$f" out/
          done
          # Visual C++ runtime and OpenMP, app-local (Microsoft allows it): a PC without
          # the VC++ Redistributable could not load any of these DLLs.
          redist=$(ls -d "C:/Program Files/Microsoft Visual Studio"/*/*/VC/Redist/MSVC/14.*/x64 | sort -V | tail -1)
          cp "$redist"/Microsoft.VC14*.CRT/msvcp140.dll "$redist"/Microsoft.VC14*.CRT/vcruntime140.dll "$redist"/Microsoft.VC14*.CRT/vcruntime140_1.dll "$redist"/Microsoft.VC14*.OpenMP/vcomp140.dll out/
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: nobodywho-windows-x86_64
          path: out/*
          retention-days: 3

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nobodywho/target
          key: macos-${{ matrix.target }}-${{ hashFiles('nobodywho/Cargo.lock') }}-${{ hashFiles('nobodywho/core/Cargo.toml', 'nobodywho/godot/Cargo.toml') }}
          restore-keys: macos-${{ matrix.target }}-
      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: nobodywho
        run: cargo build -p nobodywho-godot --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir out
          cp nobodywho/target/${{ matrix.target }}/release/libnobodywho_godot.dylib out/${{ matrix.target }}-release.dylib
          strip -x out/*.dylib
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: nobodywho-macos-${{ matrix.target }}
          path: out/*
          retention-days: 3
