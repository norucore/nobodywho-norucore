[package]
name = "nobodywho"
version = "2.4.0"
edition = "2021"

[dependencies]
misaki-rs = { optional = true, version = "0.6.0", default-features = false }
encoding_rs = "0.8.34"
thiserror = "2.0.3"
miette = { version = "7.6.0", features = ["fancy"] }
minijinja = { version = "2.11.0", features = ["builtins", "json", "loader"] }
minijinja-contrib = { version = "2.11.0", features = ["pycompat"] }
monty = "0.0.23"
monty-types = "0.0.23"
bashkit = "0.18.1"
serde = { version = "1.0.215", features = ["derive"] }
chrono = "0.4.39"
gbnf = { path = "../grammar/gbnf" }
llguidance = "1.7.5"

llama-cpp-2 = { version = "=0.1.158", default-features = false, features = [
    "openmp",
    "mtmd",
    "llguidance",
    "common",
] }
lazy_static = "1.5.0"
tokio = { version = "1.43.0", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
] }
tokio-stream = "0.1.17"
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = "0.3.19"
regex = "1.11.1"
serde_json = "1.0.140"
nom = "8.0.0"
rand = "0.10.2"
futures = "0.3.31"
ahash = "0.8.12"
indexmap = "2.13.0"
ureq = { version = "3", features = ["rustls"] }
indicatif = "0.18"
walkdir = "2.5"
tempfile = "3"
hound = { version = "3", optional = true }
safetensors = { version = "0.8.0", optional = true }
# SpeechToText audio pipeline: WAV via hound, MP3 via symphonia-bundle-mp3 directly
symphonia-core = { version = "0.5", optional = true }
symphonia-bundle-mp3 = { optional = true, version = "0.5", default-features = false, features = ["mp3"] }
rubato = { version = "0.16", optional = true }
mel_spec = { version = "0.4", optional = true }
tokenizers = { optional = true, version = "0.23.2", default-features = false, features = ["onig"] }
sentencepiece-rs = { version = "0.2", optional = true }
# Shared by SpeechToText (via mel_spec) and TextToSpeech (supertonic); use 0.17 as the workspace default
ndarray = { version = "0.17", optional = true }
rand_distr = { version = "0.6", optional = true }
unicode-normalization = { version = "0.1", optional = true }
emojis = { version = "0.9.0", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
espeak-ng = { optional = true, version = "0.2.0", default-features = false, features = [
    "bundled-data-en",
    "bundled-data-es",
    "bundled-data-fr",
    "bundled-data-it",
    "bundled-data-pt",
] }

[features]
# NoruCore fork: speech-to-text, text-to-speech and voice activity detection pull in
# ONNX Runtime, espeak-ng and the audio stack. On by default as upstream; the Godot
# build for NoruCore turns it off (the app does not use them).
default = ["speech"]
# NoruCore fork: ggml CPU variants (SSE4.2 ... AVX-512) and Vulkan as separate libraries,
# picked at runtime, so one x86_64 build is fast on new CPUs and still starts on old ones.
dynamic-backends = ["llama-cpp-2/dynamic-backends"]
speech = ["dep:misaki-rs", "dep:hound", "dep:safetensors", "dep:symphonia-core", "dep:symphonia-bundle-mp3", "dep:rubato", "dep:mel_spec", "dep:tokenizers", "dep:sentencepiece-rs", "dep:ndarray", "dep:rand_distr", "dep:unicode-normalization", "dep:emojis", "dep:unicode-segmentation", "dep:espeak-ng", "dep:ort"]

[target.'cfg(any(target_os = "android", target_vendor = "apple"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# Statically link the C++ stdlib (libc++) on Android so the produced shared
# library is self-contained. This is Android-only on purpose: on Linux, the
# `static-stdcxx` feature makes llama-cpp-rs's build.rs add the compiler's
# static-archive dir (`emit_compiler_static_archive_search_path`) to the link
# search path, which then resolves `-lgomp` to the non-PIC `libgomp.a` and
# breaks linking the cdylib ("relocation R_X86_64_TPOFF32 against hidden symbol
# `gomp_tls_data`"). Desktop keeps the dynamic libstdc++ it has always used.
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = [
    "android-static-stdcxx",
    "vulkan",
    "opencl",
] }
ort = { optional = true, version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-20"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7.0.0"
ort = { optional = true, version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-20"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

# ort is pinned exactly because its release candidates make breaking changes;
# bump deliberately and run /full-ci. Keep the CI-built ONNX Runtimes in step
# (build-ort action, Android x86_64 AAR in build.yml).
# `cuda` only where pyke ships a CUDA build: with strict feature matching, asking
# for it elsewhere (aarch64 Linux) links fine but fails to load at runtime.
# Keep this cfg in sync with the CUDA cfgs in core/src/onnx.rs.
[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64"))'.dependencies]
ort = { optional = true, version = "=2.0.0-rc.13", default-features = false, features = ["cuda"] }

# Enable Vulkan for x86_64, x86, and aarch64 targets (excluding Apple platforms and Android).
# Apple platforms use Metal, which is auto-enabled by llama-cpp-rs for all Apple targets
# (except watchOS which has no Metal support — handled in llama-cpp-rs build.rs).
[target.'cfg(all(not(target_os = "macos"), not(target_os = "ios"), not(target_os = "visionos"), not(target_os = "watchos"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")))'.dependencies]
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = [
    "openmp",
    "vulkan",
    "mtmd",
    "llguidance",
    "common",
] }

# Unifies host bitflags features (uniffi enables `std`) so llama-cpp-sys-2 is only built once.
[build-dependencies]
bitflags = { version = "2", features = ["std"] }
