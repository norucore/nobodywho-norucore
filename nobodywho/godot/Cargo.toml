[package]
name = "nobodywho-godot"
version = "12.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
nobodywho = { path = "../core", default-features = false }
godot = { version = "0.5.4", features = [ "experimental-threads" ] }
tokio = "1.44.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
serde_json = { version = "1.0.140", features = [ "preserve_order" ] }

# NoruCore fork: CPU variants picked at runtime on desktop x86_64.
[target.'cfg(all(any(target_os = "linux", target_os = "windows"), target_arch = "x86_64"))'.dependencies]
nobodywho = { path = "../core", default-features = false, features = ["dynamic-backends"] }

[features]
# NoruCore fork: off, the app does not use speech. `--features speech` restores upstream.
default = []
speech = ["nobodywho/speech"]
